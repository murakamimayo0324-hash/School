<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <style>
    :root {
      --bg-0: #0b1120;
      --bg-1: #111a2e;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.08);
      --ink: #e8edf7;
      --ink-dim: #7d8aa3;
      --accent: #38bdf8;
      --run: #22c55e;
      --stop: #ef4444;
      --lap: #3b82f6;
      --neutral: #475569;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(56, 189, 248, 0.08), transparent 60%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(1.5rem, 5vw, 3rem) 1rem 3rem;
      gap: 1.5rem;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--neutral);
      transition: background 0.2s ease;
    }
    body.is-running .title .dot {
      background: var(--run);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .save-badge {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 2px 8px;
      text-transform: none;
    }
    .restore {
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 0.5rem;
      padding: 0.4rem 0.9rem;
    }
    .restore[hidden] { display: none; }
    .display {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: clamp(3rem, 15vw, 6rem);
      line-height: 1;
      padding: clamp(1.25rem, 4vw, 2rem) clamp(1.5rem, 6vw, 3rem);
      border: 1px solid var(--panel-border);
      border-radius: 1.25rem;
      background: var(--panel);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      min-width: min(360px, 92vw);
      text-align: center;
    }
    .display .sep { color: var(--ink-dim); }
    .display .ms { color: var(--accent); font-size: 0.62em; }
    .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      font-family: var(--font-ui);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.8rem 1.6rem;
      min-width: 104px;
      border: 1px solid transparent;
      border-radius: 0.7rem;
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.2s ease;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn.primary { background: var(--run); }
    body.is-running .btn.primary { background: var(--stop); }
    .btn.lap { background: var(--lap); }
    .btn.reset { background: transparent; border-color: var(--panel-border); color: var(--ink-dim); }
    .hint {
      font-size: 0.78rem;
      color: var(--ink-dim);
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hint kbd {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
      margin-right: 3px;
    }
    .laps { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 0.6rem; }
    .laps-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--ink-dim); padding: 0 0.25rem;
    }
    .laps-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; max-height: 40vh; overflow-y: auto; }
    .lap-row {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.9rem; border: 1px solid var(--panel-border); border-radius: 0.6rem;
      background: var(--panel); font-variant-numeric: tabular-nums;
    }
    .lap-no { color: var(--ink-dim); font-size: 0.85rem; font-weight: 600; }
    .lap-split { color: var(--ink-dim); font-family: var(--font-mono); font-size: 0.82rem; text-align: right; }
    .lap-total { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
    .empty { color: var(--neutral); font-size: 0.85rem; padding: 0.6rem 0.25rem; }
  </style>
</head>
<body>
  <div class="title">
    <span class="dot"></span>ストップウォッチ
    <span class="save-badge" title="ラップと経過時間を localStorage に自動保存します">💾 自動保存</span>
  </div>

  <div class="restore" id="restore" hidden>前回の記録を復元しました（localStorage）</div>

  <div class="display" id="display">00:00<span class="sep">.</span><span class="ms">000</span></div>

  <div class="controls">
    <button class="btn primary" id="startStop" type="button">スタート</button>
    <button class="btn lap" id="lap" type="button" disabled>ラップ</button>
    <button class="btn reset" id="reset" type="button" disabled>リセット</button>
  </div>

  <div class="hint">
    <span><kbd>Space</kbd>開始 / 停止</span>
    <span><kbd>L</kbd>ラップ</span>
    <span><kbd>R</kbd>リセット</span>
  </div>

  <div class="laps">
    <div class="laps-head"><span>ラップ記録</span><span id="lapCount"></span></div>
    <ul class="laps-list" id="laps">
      <li class="empty" id="empty">まだ記録がありません</li>
    </ul>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'stopwatch-state-v1';

      var display   = document.getElementById('display');
      var startStop = document.getElementById('startStop');
      var lapBtn    = document.getElementById('lap');
      var resetBtn  = document.getElementById('reset');
      var lapsList  = document.getElementById('laps');
      var emptyMsg  = document.getElementById('empty');
      var lapCountEl = document.getElementById('lapCount');
      var restoreEl = document.getElementById('restore');

      var running = false;
      var startTime = 0;
      var elapsedBefore = 0;
      var rafId = null;
      var lapCount = 0;
      var lastLapTotal = 0;
      var lapData = []; // {no, split, total} — localStorage 保存用の実体

      function parts(ms) {
        var total = Math.floor(ms);
        var m = Math.floor(total / 60000);
        var s = Math.floor((total % 60000) / 1000);
        var ml = total % 1000;
        return { mm: String(m).padStart(2, '0'), ss: String(s).padStart(2, '0'), mmm: String(ml).padStart(3, '0') };
      }
      function fmt(ms) { var p = parts(ms); return p.mm + ':' + p.ss + '.' + p.mmm; }
      function currentElapsed() { return elapsedBefore + (running ? (performance.now() - startTime) : 0); }
      function render() {
        var p = parts(currentElapsed());
        display.innerHTML = p.mm + ':' + p.ss + '<span class="sep">.</span><span class="ms">' + p.mmm + '</span>';
      }
      function tick() { render(); rafId = requestAnimationFrame(tick); }

      // ---- localStorage（拡張機能: 永続化） ----
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            elapsed: currentElapsed(), lastLapTotal: lastLapTotal, laps: lapData
          }));
        } catch (e) {}
      }
      function clearState() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
      function appendLapRow(item) {
        if (emptyMsg.parentNode) { lapsList.removeChild(emptyMsg); }
        var li = document.createElement('li'); li.className = 'lap-row';
        var no = document.createElement('span'); no.className = 'lap-no'; no.textContent = 'ラップ ' + item.no;
        var sp = document.createElement('span'); sp.className = 'lap-split'; sp.textContent = '+' + fmt(item.split);
        var tt = document.createElement('span'); tt.className = 'lap-total'; tt.textContent = fmt(item.total);
        li.appendChild(no); li.appendChild(sp); li.appendChild(tt);
        lapsList.appendChild(li);
      }
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          var d = JSON.parse(raw);
          if (!d) return;
          var hasData = (d.elapsed && d.elapsed > 0) || (d.laps && d.laps.length);
          if (!hasData) return;
          elapsedBefore = d.elapsed || 0;
          lastLapTotal = d.lastLapTotal || 0;
          lapData = Array.isArray(d.laps) ? d.laps : [];
          lapCount = lapData.length;
          lapData.forEach(appendLapRow);
          if (lapCount) { lapCountEl.textContent = lapCount + ' 件'; }
          resetBtn.disabled = false;
          restoreEl.hidden = false;
          render();
        } catch (e) {}
      }

      function start() {
        running = true;
        startTime = performance.now();
        startStop.textContent = 'ストップ';
        document.body.classList.add('is-running');
        lapBtn.disabled = false;
        resetBtn.disabled = false;
        tick();
      }
      function stop() {
        elapsedBefore = currentElapsed();
        running = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        startStop.textContent = 'スタート';
        document.body.classList.remove('is-running');
        render();
        saveState();
      }
      function reset() {
        running = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        elapsedBefore = 0; startTime = 0; lapCount = 0; lastLapTotal = 0; lapData = [];
        startStop.textContent = 'スタート';
        document.body.classList.remove('is-running');
        lapBtn.disabled = true;
        resetBtn.disabled = true;
        render();
        lapsList.innerHTML = '';
        lapsList.appendChild(emptyMsg);
        lapCountEl.textContent = '';
        restoreEl.hidden = true;
        clearState();
      }
      function recordLap() {
        var total = currentElapsed();
        var split = total - lastLapTotal;
        lastLapTotal = total;
        lapCount++;
        var item = { no: lapCount, split: split, total: total };
        lapData.push(item);
        appendLapRow(item);
        lapCountEl.textContent = lapCount + ' 件';
        saveState();
      }

      startStop.addEventListener('click', function () { running ? stop() : start(); });
      lapBtn.addEventListener('click', function () { if (running) recordLap(); });
      resetBtn.addEventListener('click', reset);

      // ---- キーボード操作（拡張機能） ----
      document.addEventListener('keydown', function (e) {
        if (e.code === 'Space') { e.preventDefault(); running ? stop() : start(); }
        else if (e.key === 'l' || e.key === 'L') { if (running) recordLap(); }
        else if (e.key === 'r' || e.key === 'R') { if (!resetBtn.disabled) reset(); }
      });

      // 実行中に離脱してもデータを失わないよう保存（localStorage）
      window.addEventListener('pagehide', saveState);
      document.addEventListener('visibilitychange', function () { if (document.hidden) saveState(); });

      loadState();
      render();
    })();
  </script>
</body>
</html>
